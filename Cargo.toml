[package]
name = "livr-axum"
description = "axum extractors for LIVR 2.0 validation with livr: all errors at once as JSON, typed schemas, query strings, forms, schemas loaded at run time"
keywords = ["axum", "validation", "livr", "extractor", "validator"]
categories = ["web-programming::http-server"]
readme = "README.md"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/koorchik/rust-livr-axum"
homepage = "https://livr-spec.org"
documentation = "https://docs.rs/livr-axum"
# What the crate needs to build, test and run its examples; not the files
# for the repository (CLAUDE.md, .github)
include = ["/src", "/tests", "/examples", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
axum = { version = "0.8", default-features = false }
form_urlencoded = "1"
http-body-util = "0.1"
# rust-livr checked out next to this repository; `cargo publish` uses the version
livr = { path = "../rust-livr/livr", version = "0.1.0" }
# Map::retain, as livr
serde_json = "1.0.70"

[dev-dependencies]
axum = { version = "0.8", features = ["macros"] }
# Streamed bodies in the tests; axum depends on it already
futures-util = { version = "0.3", default-features = false }
serde = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
